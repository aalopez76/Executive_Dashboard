name: CI

on:
  push:
    branches: [main, "chore/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (con submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff) — solo aportes nuevos
        # El código heredado (app.py, utils/) tiene deuda de imports; se limpia
        # opt-in con `make lint`/`make format`. Aquí se lintean los archivos añadidos.
        run: ruff check tests/

      - name: Tests (pytest)
        run: pytest
